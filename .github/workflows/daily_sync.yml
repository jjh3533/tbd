name: Daily Amazon Price Sync

on:
  schedule:
    # UTC 기준 00:00 = 한국 시간(KST) 매일 아침 09:00
    - cron: '0 0 * * *'
  workflow_dispatch: # 필요할 때 GitHub 웹에서 수동으로도 즉시 실행 가능

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit pyairtable requests yfinance pandas beautifulsoup4

      - name: Run Tracker Script
        run: python tbd_tracker.py
